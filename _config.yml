# GitHub Pages (Jekyll) の設定。
# theme は GitHub Pages が標準で用意しているものから選ぶ。独自 gem は使えない。
title: らじぽけ
description: Android 向けラジオ録音アプリ「らじぽけ」のドキュメント
theme: jekyll-theme-minimal
lang: ja

# SNS に貼ったときの見え方（OGP）。**絶対URLが要るので url と baseurl を明示する。**
# GitHub Pages が自動で入れる値と同じだが、書いてあれば absolute_url の結果が読んで分かる。
url: https://radipocket.github.io
baseurl: /docs

# og:image の既定値。ページの front matter に image があればそちらが勝つ。
# ファイル名を英数字にしてあるのは、SNS の取得側が日本語のURLを取りこぼすことがあるため。
og_image: /images/ogp-1200x675.png
og_image_alt: らじぽけの画面。左から、聴く・録る・あとで聴く。
twitter_site: "@radiopocketjp"

# ドキュメント以外は公開物に含めない。
exclude:
  - README.md

# 左ペインのメニュー。_layouts/default.html がここを読んで並べる。
# URL は拡張子まで書く（Markdown を .html に変換して公開しているため）。
nav:
  - title: 紹介
    url: /
  - title: 使い方
    url: /manual.html
  - title: テスト参加
    url: /test.html
  - title: 開発ロードマップ
    url: /roadmap.html
  - title: 変更履歴
    url: /changelog.html
  - title: プライバシーポリシー
    url: /privacy-policy.html
