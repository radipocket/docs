<link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
<style>
/* 画面写真。テーマの img{max-width:100%} だけだと本文の幅いっぱい（500px）に
   伸びて1枚が縦1000px を超えるので、ここで抑える。
   GitHub Pages は Markdown の images/x.webp を /docs/images/x.webp に書き換える
   ため、前方一致ではなく部分一致で当てる。 */
img[src*="images/"]{
  display:block;
  width:100%;
  max-width:270px;
  height:auto;
  aspect-ratio:720/1540;   /* 読み込み中に本文が飛ばないように場所を取っておく */
  margin:0 auto 12px;
  border:1px solid #e0e0e0;
  border-radius:8px;
}

/* 記事（articles/）の画面写真。**縦横の比は画像ごとに違う**（下を切った写真がある）ので、
   上の images/ 用と違って aspect-ratio を決め打ちしない。Markdown で {: .shot} を付けた img だけに効く。 */
img.shot{
  display:block;
  width:100%;
  max-width:270px;
  height:auto;
  margin:0 auto 12px;
  border:1px solid #e0e0e0;
  border-radius:8px;
}
/* 記事の日付と、非公式である旨の注記。本文より控えめに。 */
.article-meta,.article-note{
  font-size:13px;
  color:#666;
}

/* YouTube ショート（縦長 9:16）。**画面写真と同じ 270px に収める。**
   幅いっぱいに広げると、隣に並ぶ画面写真より 2.6 倍大きくなって釣り合わない。
   上の img[src*="images/"] は iframe には当たらないので、別に書く。
   aspect-ratio で先に場所を取り、読み込み中に本文が飛ぶのを防ぐ（画像と同じ考え方）。 */
.short{
  width:100%;
  max-width:270px;
  aspect-ratio:9/16;
  margin:0 auto 12px;
}
.short iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  border-radius:8px;
}

/* 紹介動画（_includes/video.html）。**押すまで YouTube を読み込まない**——最初はこのサイトの
   サムネイルと再生の印だけ。押したら下のスクリプトが youtube-nocookie.com の埋め込みに差し替える。
   サムネイルは横長（16:9）。ショートは押したら縦長（9:16・270px）にする（画面写真と同じ幅）。 */
.yt-lazy{margin:0 auto 16px;max-width:500px}
.yt-lazy .yt-open{
  position:relative;display:block;width:100%;padding:0;border:0;background:#000;
  border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;
}
.yt-lazy .yt-open img{
  display:block;width:100%;height:100%;object-fit:cover;
  max-width:none;margin:0;border:0;border-radius:0;aspect-ratio:auto;
}
.yt-lazy .yt-play{
  position:absolute;left:50%;top:50%;width:68px;height:48px;margin:-24px 0 0 -34px;
  background:rgba(33,33,33,.85);border-radius:12px;
}
.yt-lazy .yt-play::after{
  content:"";position:absolute;left:27px;top:14px;
  border-style:solid;border-width:10px 0 10px 17px;border-color:transparent transparent transparent #fff;
}
.yt-lazy .yt-open:hover .yt-play,.yt-lazy .yt-open:focus .yt-play{background:#f00}
.yt-lazy iframe{display:block;width:100%;height:100%;border:0;border-radius:8px}
.yt-lazy.yt-playing{aspect-ratio:16/9}
.yt-lazy.yt-tall.yt-playing{max-width:270px;aspect-ratio:9/16}
.yt-caption{font-size:13px;color:#666;margin:6px 0 0;text-align:center}
.yt-lazy.yt-playing .yt-caption{display:none}

/* 料金の表は4列ある。狭い画面では、まず折り返して収める。
   nowrap にすると横スクロールになり、いちばん右の「プレミアム」が
   隠れてしまう。料金表で上位プランが見えないのは困る。
   それでも入りきらないときのために overflow だけ残しておく。 */
@media screen and (max-width: 640px){
  section table{display:block;overflow-x:auto}
  section th,section td{padding:5px 6px}
}

/* 表のいちばん左の列は折り返さない。変更履歴の区分が「機能追／加」と
   2行に割れて読みにくかった。「不具合修正」でも 5文字ぶんなので、
   狭い画面でも本文の幅を圧迫しない。 */
section td:first-child{white-space:nowrap}

/* 左ペインのメニュー。テーマにナビゲーションが無いので足す。 */
.site-nav{
  list-style:none;
  padding:0;
  margin:24px 0 0;
  border-top:1px solid #e5e5e5;
}
.site-nav li{margin:0}
.site-nav a{
  display:block;
  padding:8px 2px;
  border-bottom:1px solid #e5e5e5;
}
.site-nav a.current{
  font-weight:700;
  color:#222;
}
.site-nav a.current:hover{color:#222}

/* テーマは画面が狭くなると header ul（ダウンロード用の並び）を絶対配置に
   飛ばす。こちらのメニューまで飛ばされると読めなくなるので、打ち消す。 */
@media print, screen and (max-width: 960px){
  header ul.site-nav{position:static;right:auto;top:auto}
}
/* 変更履歴の箇条書き。**Markdown は行内の改行を空白に潰す**（kramdown の既定）ので、
   「・」の行が繋がって1つの段落になっていた。<br> を並べるより pre-wrap のほうが、
   選択してコピーしたときに改行がそのまま入る。Play Console に貼る用途なので、
   見た目より「コピーした結果」を優先する。
   フォントは本文のまま（pre ではなく div にしているのはそのため）。 */
.paste{
  white-space:pre-wrap;      /* 改行はそのまま、長い行だけ折り返す */
  word-break:break-word;     /* 狭い画面で横スクロールにしない */
  margin:0 0 20px;
}

/* フッターの連絡先。左ペインは 250px しかないので、**行をつめて小さく**出す。
   本文より目立たせない——読みに来た人の邪魔をせず、探せばある、くらいでよい。 */
.site-contact{
  margin:16px 0 0;
  font-size:12px;
  line-height:1.7;
  word-break:break-all;      /* 狭い画面でメールアドレスがはみ出さないように */
}
.site-contact strong{font-weight:700}

/* 使い方ページのフッターは横1本。こちらは中央に寄せる。 */
.mfooter .site-contact{
  word-break:normal;
  margin-top:8px;
}
</style>
<script>
/* 紹介動画: 押したときだけ youtube-nocookie.com の埋め込みに差し替える（_includes/video.html）。 */
document.addEventListener('click', function (e) {
  var btn = e.target.closest ? e.target.closest('.yt-lazy .yt-open') : null;
  if (!btn) return;
  var box = btn.parentNode;
  var id = box.getAttribute('data-id');
  if (!/^[\w-]{11}$/.test(id)) return;
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1';
  f.title = box.getAttribute('data-title') || 'YouTube';
  f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; web-share');
  f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  f.setAttribute('allowfullscreen', '');
  box.classList.add('yt-playing');
  box.replaceChild(f, btn);
});
</script>
